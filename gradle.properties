# === JVM 堆与 GC（按本机 2 核 4 线程 / 8GB 内存调优）===
# -Xmx4g 超过空闲内存(约4.8G)会触发换页；-Xmx2g 实测会让 R8 OOM。
# -Xmx3g 是本机平衡点：不换页、R8(双 flavor) 也能稳定跑完。
# G1GC + 限制 GC 线程数，避免 2 核被 GC 占满。
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:ParallelGCThreads=2 -XX:ConcGCThreads=1 -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED

# === 并行度（2 核 4 线程，限制为 2 避免超订阅争抢）===
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true

# === 守护进程（避免每次 fork 一次性 JVM，复用 JIT 预热）===
org.gradle.daemon=true
org.gradle.vfs.watch=false

# === 持久化的 release 编译提速（对所有构建生效，无需每次传 -P 参数）===
# skipLint=true：跳过 release lintVital 静态分析（不影响 APK 内容与签名）。
# stableBuild=true：固定 BUILD_TIME，源码未变时 Java 编译与 R8 直接 UP-TO-DATE。
# 正式出包需要真实构建时间戳时，用 -PskipLint=false -PstableBuild=false 覆盖即可。
skipLint=true
stableBuild=true
