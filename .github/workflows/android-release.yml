name: Android Release

# One release variant is assembled per matrix job instead of all four in a single
# Gradle invocation. In the single-invocation layout four concurrent
# mergeResources tasks shared one runner's CPU budget, so on a degraded host a
# single AAPT2 compile request exceeded AGP's fixed 2-minute
# Aapt2DaemonTimeouts.compile limit and aborted the whole build before any APK
# existed (run 44227901940: the build step ran 58 min, failed at 39 min, and
# published nothing). Per-variant jobs
# keep one resource merge per runner, run in parallel, and retry the assemble
# step once, so a slow host costs one variant attempt instead of the release.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, blank = v<versionName>-yyyyMMddHHmm or v<versionName>-beta-yyyyMMddHHmm"
        required: false
        type: string
      release_channel:
        description: "Release channel, auto uses beta on dev/fongmi-sync and stable on main"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - stable
          - beta
      release_notes:
        description: "Release notes, use \\n for Markdown newlines"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean
      sync_cnb:
        description: "Optionally mirror APKs to CNB Release and sync CNB manifests"
        required: false
        default: false
        type: boolean
      publish_oci:
        description: "Publish APKs as OCI artifacts when Registry variables and secrets are configured"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-update-channel
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  CNB_API_ENDPOINT: https://api.cnb.cool
  CNB_WEB_ENDPOINT: https://cnb.cool
  CNB_REPO_SLUG: fish2035/webhtv-release
  CNB_REPO_URL: https://cnb.cool/fish2035/webhtv-release.git
  UPDATE_CHANNEL_TAG: update-channel

jobs:
  meta:
    name: Resolve release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      channel: ${{ steps.meta.outputs.channel }}
      apk_suffix: ${{ steps.meta.outputs.apk_suffix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: meta
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          CHANNEL="${{ inputs.release_channel }}"
          if [ "$CHANNEL" = "auto" ] || [ -z "$CHANNEL" ]; then
            if [ "${{ github.ref_name }}" = "dev" ] || [ "${{ github.ref_name }}" = "fongmi-sync" ]; then
              CHANNEL="beta"
            else
              CHANNEL="stable"
            fi
          fi
          COMMIT_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          TAG_TIME="$(date -d "@$COMMIT_EPOCH" +%Y%m%d%H%M)"
          if [ "$CHANNEL" = "beta" ]; then
            APK_SUFFIX="-beta"
            TAG_PATTERN="^v${VERSION_NAME}-beta-[0-9]{12}$"
            TAG_DEFAULT="v${VERSION_NAME}-beta-$TAG_TIME"
            TAG_EXPECT="v${VERSION_NAME}-beta-yyyyMMddHHmm"
          else
            APK_SUFFIX=""
            TAG_PATTERN="^v${VERSION_NAME}-[0-9]{12}$"
            TAG_DEFAULT="v${VERSION_NAME}-$TAG_TIME"
            TAG_EXPECT="v${VERSION_NAME}-yyyyMMddHHmm"
          fi
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$TAG_DEFAULT"
          fi
          if ! printf '%s' "$TAG" | grep -Eq "$TAG_PATTERN"; then
            echo "::error title=Invalid release tag::Expected $TAG_EXPECT, got: $TAG"
            exit 1
          fi
          if EXISTING_TAG_SHA="$(git rev-parse "$TAG^{commit}" 2>/dev/null)"; then
            if [ "$EXISTING_TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error title=Existing release tag targets another commit::$TAG points to $EXISTING_TAG_SHA, expected $GITHUB_SHA"
              exit 1
            fi
            echo "::notice title=Reusing release tag::$TAG already points to this commit"
          fi
          {
            echo "tag=$TAG"
            echo "title=${TAG#v}"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "short_sha=$(git rev-parse --short=7 HEAD)"
            echo "channel=$CHANNEL"
            echo "apk_suffix=$APK_SUFFIX"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Release-critical tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Chaquopy pins buildPython to 3.10 (chaquo/build.gradle) and fails on a
      # different interpreter, so 3.10 must be the python3 on PATH for Gradle.
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          # API 37 is not published in sdkmanager's stable channel; install the platform archive directly.
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;36.0.0"
          curl -fsSL -o /tmp/platform-37.zip https://dl.google.com/android/repository/platform-37.0_r01.zip
          rm -rf /tmp/platform-37 "$ANDROID_HOME/platforms/android-37"
          mkdir -p /tmp/platform-37 "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.zip -d /tmp/platform-37
          platform_jar="$(find /tmp/platform-37 -name android.jar -print -quit)"
          test -n "$platform_jar"
          mv "$(dirname "$platform_jar")" "$ANDROID_HOME/platforms/android-37"

      - name: Run release-critical tests
        timeout-minutes: 25
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :app:testMobileArm64_v8aDebugUnitTest \
            --tests 'com.fongmi.android.tv.player.danmaku.*' \
            --tests 'com.fongmi.android.tv.UpdateChannelTest' \
            --tests 'com.fongmi.android.tv.UpdaterFutureTest' \
            --tests 'com.fongmi.android.tv.utils.GithubTest' \
            --tests 'com.fongmi.android.tv.utils.GithubProxyTest' \
            --tests 'com.fongmi.android.tv.ui.dialog.AboutDialogLayoutTest' \
            --tests 'com.fongmi.android.tv.ui.dialog.UpdateDialogChannelVisibilityTest' \
            --tests 'com.fongmi.android.tv.ui.adapter.VodAdapterLayoutTest' \
            --no-daemon
          ./gradlew \
            :app:testLeanbackArm64_v8aDebugUnitTest \
            --tests 'com.fongmi.android.tv.ui.dialog.UpdateDialogLayoutTest' \
            --no-daemon

  build:
    name: Build ${{ matrix.variant }} APK
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        variant:
          - MobileArm64_v8a
          - MobileArmeabi_v7a
          - LeanbackArm64_v8a
          - LeanbackArmeabi_v7a

    env:
      WEBHTV_RELEASE_TAG: ${{ needs.meta.outputs.tag }}
      WEBHTV_APK_SUFFIX: ${{ needs.meta.outputs.apk_suffix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Chaquopy pins buildPython to 3.10 (chaquo/build.gradle) and fails on a
      # different interpreter, so 3.10 must be the python3 on PATH for Gradle.
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify bundled MPV native assets
        run: bash scripts/verify_mpv_native_assets.sh --require-elf

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          # API 37 is not published in sdkmanager's stable channel; install the platform archive directly.
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;36.0.0"
          curl -fsSL -o /tmp/platform-37.zip https://dl.google.com/android/repository/platform-37.0_r01.zip
          rm -rf /tmp/platform-37 "$ANDROID_HOME/platforms/android-37"
          mkdir -p /tmp/platform-37 "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.zip -d /tmp/platform-37
          platform_jar="$(find /tmp/platform-37 -name android.jar -print -quit)"
          test -n "$platform_jar"
          mv "$(dirname "$platform_jar")" "$ANDROID_HOME/platforms/android-37"

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS_BASE64="${RELEASE_KEYSTORE_BASE64:-$KEYSTORE_BASE64}"
          STORE_PASSWORD="${RELEASE_STORE_PASSWORD:-$KEY_PASSWORD}"
          ALIAS="${RELEASE_KEY_ALIAS:-$KEY_ALIAS}"
          KEY_PASS="${RELEASE_KEY_PASSWORD:-$STORE_PASSWORD}"
          if [ -z "$KS_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$ALIAS" ]; then
            echo "::error title=Release signing not configured::Configure RELEASE_KEYSTORE_BASE64, RELEASE_KEY_ALIAS and RELEASE_STORE_PASSWORD in repository secrets."
            exit 1
          fi
          mkdir -p app/signing
          printf '%s' "$KS_BASE64" | base64 --decode > app/signing/release.jks
          {
            echo "storeFile=$GITHUB_WORKSPACE/app/signing/release.jks"
            echo "keyAlias=$ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASS"
          } > local.properties
          echo "Release signing configured"

      - name: Assemble release APK
        timeout-minutes: 55
        env:
          VARIANT: ${{ matrix.variant }}
          BUILD_ATTEMPTS: "2"
          ATTEMPT_TIMEOUT_SECONDS: "1500"
        run: |
          chmod +x ./gradlew
          attempt=1
          while true; do
            rm -rf Release/apk
            # Bound the attempt here, not at the step level: a wedged or starved
            # build must fail inside this loop so the retry below can still run.
            set +e
            timeout --signal=TERM --kill-after=60s "${ATTEMPT_TIMEOUT_SECONDS}s" \
              ./gradlew ":app:assemble${VARIANT}Release" --no-daemon
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -eq 124 ] || [ "$status" -eq 125 ]; then
              # 124 = GNU timeout expired; 125 = the timeout wrapper itself failed or terminated the attempt.
              echo "::warning title=Build attempt timed out::assemble${VARIANT}Release did not finish within ${ATTEMPT_TIMEOUT_SECONDS}s on attempt ${attempt} (exit ${status})."
            fi
            if [ "$attempt" -ge "$BUILD_ATTEMPTS" ]; then
              echo "::error title=Release build failed::assemble${VARIANT}Release failed on attempt ${attempt} of ${BUILD_ATTEMPTS} (last exit status ${status})."
              exit 1
            fi
            echo "::warning title=Retrying ${VARIANT} build::Attempt ${attempt} exited with ${status}; retrying once. This covers transient runner saturation, network, and AAPT2 daemon failures, not deterministic build errors."
            attempt=$((attempt + 1))
            sleep 20
          done

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t apks < <(find Release/apk -maxdepth 1 -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error title=Unexpected APK count::Expected exactly one APK for ${{ matrix.variant }}, found ${#apks[@]}."
            exit 1
          fi
          cp "${apks[0]}" dist/
          ls -lh dist/

      - name: Upload ${{ matrix.variant }} APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [meta, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: dist
          merge-multiple: true

      - name: Collect artifacts
        run: |
          set -euo pipefail
          apk_count="$(find dist -maxdepth 1 -name '*.apk' | wc -l)"
          if [ "$apk_count" -ne 4 ]; then
            echo "::error title=Missing release APKs::Expected 4 APKs, found $apk_count."
            find dist -maxdepth 1 -name '*.apk' -printf '%f\n' || true
            exit 1
          fi
          ls -lh dist/

      # publish_oci defaults to true, so an unconfigured registry must not fail the
      # release: the input only promises OCI artifacts when a registry is set up.
      - name: Report OCI publishing state
        if: ${{ inputs.publish_oci && vars.OCI_REPOSITORY == '' }}
        run: |
          echo "::notice title=OCI publishing skipped::publish_oci is enabled but vars.OCI_REPOSITORY is not configured. APKs are published to GitHub Releases only."

      - name: Set up ORAS
        id: oras
        if: ${{ inputs.publish_oci && vars.OCI_REPOSITORY != '' }}
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz
          checksum: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454

      - name: Publish APKs to OCI Registry
        id: oci
        if: ${{ inputs.publish_oci && vars.OCI_REPOSITORY != '' && steps.oras.outcome == 'success' }}
        env:
          DIST_DIR: dist
          OCI_METADATA_FILE: build/oci-metadata.json
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          OCI_REPOSITORY: ${{ vars.OCI_REPOSITORY }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          OCI_TOKEN: ${{ secrets.OCI_TOKEN }}
        run: bash .github/scripts/publish-oci-apks.sh

      - name: Prepare release notes input
        id: release_notes
        env:
          RELEASE_NOTES_RAW: ${{ inputs.release_notes }}
        run: |
          python3 - <<'PY'
          import os

          raw = os.environ.get("RELEASE_NOTES_RAW", "").strip()
          notes = (
              raw
              .replace("\\r\\n", "\n")
              .replace("\\n", "\n")
              .replace("\\t", "\t")
              .replace('\\"', '"')
              .replace("\\'", "'")
          )
          delimiter = "RELEASE_NOTES_EOF"
          while delimiter in notes:
              delimiter += "_"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"has_notes={'true' if notes else 'false'}\n")
              fh.write(f"notes<<{delimiter}\n")
              fh.write(notes)
              if notes and not notes.endswith("\n"):
                  fh.write("\n")
              fh.write(f"{delimiter}\n")
          PY

      - name: Generate update manifests
        env:
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
          GITHUB_RELEASE_DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/${{ needs.meta.outputs.tag }}
          OCI_PUBLISH_OUTCOME: ${{ steps.oci.outcome }}
        run: |
          python3 - <<'PY'
          import glob
          import hashlib
          import json
          import os

          tag = "${{ needs.meta.outputs.tag }}"
          notes = os.environ.get("RELEASE_NOTES", "").strip()
          release_download_base = os.environ["GITHUB_RELEASE_DOWNLOAD_BASE"]
          oci = {}
          oci_metadata = "build/oci-metadata.json"
          if os.environ.get("OCI_PUBLISH_OUTCOME") == "success" and os.path.isfile(oci_metadata):
              with open(oci_metadata, encoding="utf-8") as fh:
                  oci = json.load(fh)
          for apk in glob.glob("dist/*.apk"):
              base = os.path.splitext(os.path.basename(apk))[0]
              with open(apk, "rb") as fh:
                  content = fh.read()
              data = {
                  "name": tag,
                  "versionName": "${{ needs.meta.outputs.version_name }}",
                  "desc": f"{tag} - ${{ needs.meta.outputs.short_sha }}",
                  "channel": "${{ needs.meta.outputs.channel }}",
                  "code": int("${{ needs.meta.outputs.version_code }}"),
                  "apk": f"{release_download_base}/{base}.apk",
                  "size": len(content),
                  "sha256": hashlib.sha256(content).hexdigest(),
                  "downloads": {
                      "github": {"url": f"{release_download_base}/{base}.apk"},
                  },
              }
              if base in oci:
                  descriptor = oci[base]
                  if descriptor.get("size") != len(content) or descriptor.get("layerDigest") != "sha256:" + data["sha256"]:
                      raise SystemExit(f"OCI descriptor does not match {base}.apk")
                  data["downloads"]["oci"] = descriptor
              if notes:
                  data["notes"] = notes
              with open(f"dist/{base}.json", "w", encoding="utf-8") as fh:
                  json.dump(data, fh, ensure_ascii=False, indent=2)
                  fh.write("\n")
          PY
          ls -lh dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ] || [ "${{ needs.meta.outputs.channel }}" = "beta" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          NOTES="${RELEASE_NOTES:-手动触发 GitHub Actions 构建发布。}"
          if gh release view "${{ needs.meta.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ needs.meta.outputs.tag }}" dist/*.apk dist/*.json --clobber
          else
            gh release create "${{ needs.meta.outputs.tag }}" \
              --target "$GITHUB_SHA" \
              --title "${{ needs.meta.outputs.title }}" \
              --notes "$NOTES" \
              $PRERELEASE_FLAG \
              dist/*.apk dist/*.json
          fi

      - name: Publish update channel manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf channel-manifests other-channel-manifests
          mkdir -p channel-manifests other-channel-manifests
          cp dist/*.json channel-manifests/

          if [ "${{ needs.meta.outputs.channel }}" = "stable" ]; then
            OTHER_TAG="$(gh release list --limit 100 --json tagName,isDraft,isPrerelease \
              --jq '[.[] | select((.isDraft == false) and (.isPrerelease == true) and (.tagName | test("-beta-[0-9]{12}$")))] | first | .tagName // ""')"
            OTHER_PATTERN="*-beta.json"
          else
            OTHER_TAG="$(gh release list --limit 100 --json tagName,isDraft,isPrerelease \
              --jq '[.[] | select((.isDraft == false) and (.isPrerelease == false) and (.tagName | test("^v.+-[0-9]{12}$")))] | first | .tagName // ""')"
            OTHER_PATTERN="*.json"
          fi

          if [ -n "$OTHER_TAG" ]; then
            if gh release download "$OTHER_TAG" --pattern "$OTHER_PATTERN" --dir other-channel-manifests; then
              for manifest in other-channel-manifests/*.json; do
                [ -e "$manifest" ] || continue
                if [ "${{ needs.meta.outputs.channel }}" = "beta" ] && [[ "$(basename "$manifest")" == *-beta.json ]]; then
                  continue
                fi
                cp "$manifest" channel-manifests/
              done
            else
              echo "::warning title=Channel manifest seed failed::Could not download $OTHER_PATTERN from $OTHER_TAG."
            fi
          fi

          if ! gh release view "$UPDATE_CHANNEL_TAG" >/dev/null 2>&1; then
            gh release create "$UPDATE_CHANNEL_TAG" \
              --target "$GITHUB_SHA" \
              --title "Update channel manifests" \
              --notes "Machine-managed stable and beta update manifests." \
              --prerelease
          fi
          gh release upload "$UPDATE_CHANNEL_TAG" channel-manifests/*.json --clobber

      - name: Sync to CNB
        if: ${{ inputs.sync_cnb }}
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          CNB_RELEASE_TITLE: ${{ needs.meta.outputs.title }}
          CNB_RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
          CNB_RELEASE_PRERELEASE: ${{ inputs.prerelease == true || needs.meta.outputs.channel == 'beta' }}
          CNB_RELEASE_LATEST: ${{ needs.meta.outputs.channel == 'stable' }}
        run: |
          .github/scripts/sync-cnb-release.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webhtv-${{ needs.meta.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
